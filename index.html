<!-- ✅ TRACKING SYSTEM -->
<script>
let sessionStart = Date.now();
let hasStartedGame = false;

function safeClarity(type, name, value) {
  if (window.clarity) {
    if(type === "event") window.clarity("event", name);
    if(type === "set") window.clarity("set", name, value);
  }
}

// basic info
safeClarity("event", "page_loaded");
safeClarity("set", "game_version", "1.8.8");
safeClarity("set", "site_type", "eaglercraft");

// track tab focus (are they actually playing?)
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    safeClarity("event", "tab_hidden");
  } else {
    safeClarity("event", "tab_focused");
  }
});

// track leaving (session length)
window.addEventListener("beforeunload", () => {
  let duration = Math.floor((Date.now() - sessionStart) / 1000);
  safeClarity("set", "session_seconds", duration);
});
</script>

<script src="bootstrap.js"></script>

<script>
"use strict";
window.addEventListener("load", function() {

if(window.location.href.indexOf("file:") === 0){
alert("HTTP please, run a local HTTP server");
return;
}

window.eaglercraftXOpts = {
demoMode: false,
container: "game_frame",
assetsURI: "assets.epw",
worldsDB: "worlds",
servers: [],
relays: [
{ addr: "wss://relay.deev.is/", comment: "Hughs-relay", primary: true }
]
};

// URL server tracking
var q = window.location.search;
if(q && q[0] === "?" && window.URLSearchParams){
var params = new URLSearchParams(q);
var s = params.get("server");
if(s){
  window.eaglercraftXOpts.joinServer = s;

  // ✅ track server join
  safeClarity("event", "server_joined");
  safeClarity("set", "server_address", s);
}
}

// detect first actual game boot
if(!hasStartedGame){
  hasStartedGame = true;
  safeClarity("event", "game_started");
}

// delay to ensure Clarity loads before firing
setTimeout(() => {
  safeClarity("event", "game_boot_complete");
}, 1500);

// 🔥 launch game
main();

});
</script>

</head>

<body style="margin:0;width:100%;height:100%;overflow:hidden;background:black;" id="game_frame"></body>
</html>
